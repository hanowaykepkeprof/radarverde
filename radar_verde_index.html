<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Verde - Painel do Cerrado</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    #map {
      height: 100vh;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 10px;
    }
    .legend {
      margin-top: 20px;
    }
    .legend div {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }
    .color-box {
      width: 20px;
      height: 20px;
      margin-right: 8px;
    }
    .area-controls {
      margin-top: 15px;
    }
    canvas {
      margin-top: 20px;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <div class="row" style="margin-bottom: 0;">
    <div id="map" class="col s12 l8"></div>
    <div id="info" class="col s12 l4 card-panel">
    <h1>Radar Verde</h1>
    <p><b>Parque Estadual do Cantão – Caseara/TO</b></p>
    <p>Temperatura: <b>35°C</b></p>
    <p>Umidade: <b>20%</b></p>
    <p>Vento: <b>30 km/h</b></p>
    <p>Focos de Calor: <b>3</b></p>

    <div class="collection with-header">
      <div class="collection-header"><h4>Legenda de Risco</h4></div>
      <div class="collection-item"><div>Baixo<a href="#!" class="secondary-content"><div class="color-box green accent-4"></div></a></div></div>
      <div class="collection-item"><div>Médio<a href="#!" class="secondary-content"><div class="color-box yellow accent-4"></div></a></div></div>
      <div class="collection-item"><div>Alto<a href="#!" class="secondary-content"><div class="color-box orange darken-2"></div></a></div></div>
      <div class="collection-item"><div>Crítico<a href="#!" class="secondary-content"><div class="color-box red darken-2"></div></a></div></div>
    </div>

    <h3>Controle de Áreas</h3>
    <div id="areaControls" class="area-controls"></div>

    <h3>Histórico de Risco (últimos 7 dias)</h3>
    <div style="height: 200px;">
      <canvas id="graficoRisco"></canvas>
    </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Inicializa mapa centrado em Caseara/TO
    var map = L.map('map').setView([-9.2749, -49.9528], 11);

    // Camada base: imagens de satélite Esri
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye'
    }).addTo(map);

    // Lista de riscos
    var riscos = [
      {cor:'green', texto:'Baixo'},
      {cor:'yellow', texto:'Médio'},
      {cor:'orange', texto:'Alto'},
      {cor:'red', texto:'Crítico'}
    ];

    // Áreas fictícias dentro do parque
    var areas = [
      {
        nome: 'Área Norte',
        coords: [
          [-9.20,-49.99],
          [-9.20,-49.93],
          [-9.25,-49.93],
          [-9.25,-49.99]
        ],
        riscoIndex: 0
      },
      {
        nome: 'Área Central',
        coords: [
          [-9.28,-49.98],
          [-9.28,-49.94],
          [-9.33,-49.94],
          [-9.33,-49.98]
        ],
        riscoIndex: 2
      },
      {
        nome: 'Área Sul',
        coords: [
          [-9.35,-49.97],
          [-9.35,-49.93],
          [-9.40,-49.93],
          [-9.40,-49.97]
        ],
        riscoIndex: 3
      }
    ];

    // Criar polígonos
    areas.forEach((a,i)=>{
      a.poly = L.polygon(a.coords, {
        color:riscos[a.riscoIndex].cor,
        fillColor:riscos[a.riscoIndex].cor,
        fillOpacity:0.5
      }).addTo(map)
        .bindPopup(a.nome+' - Risco '+riscos[a.riscoIndex].texto);
    });

    // Criar controles (botões) para cada área
    var areaControlsDiv = document.getElementById('areaControls');
    areas.forEach((a,i)=>{
      var btn = document.createElement('button');
      btn.className = 'btn ' + riscos[a.riscoIndex].cor;
      btn.textContent = 'Trocar Risco - '+a.nome+' (atual: '+riscos[a.riscoIndex].texto+')';
      btn.onclick = function(){
        // Avança risco dessa área
        a.riscoIndex = (a.riscoIndex + 1) % riscos.length;
        a.poly.setStyle({color:riscos[a.riscoIndex].cor, fillColor:riscos[a.riscoIndex].cor});
        a.poly.bindPopup(a.nome+' - Risco '+riscos[a.riscoIndex].texto);
        btn.textContent = 'Trocar Risco - '+a.nome+' (atual: '+riscos[a.riscoIndex].texto+')';
        btn.className = 'btn ' + riscos[a.riscoIndex].cor;
      };
      areaControlsDiv.appendChild(btn);
    });

    // Gráfico histórico de risco (dados fictícios)
    var ctx = document.getElementById('graficoRisco').getContext('2d');
    var grafico = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Dia -6','Dia -5','Dia -4','Dia -3','Dia -2','Ontem','Hoje'],
        datasets: [{
          label: 'Índice de Risco Médio (0=Baixo / 3=Crítico)',
          data: [1,2,2,3,3,2,3],
          borderColor: '#e74c3c',
          backgroundColor: 'rgba(231,76,60,0.2)',
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            min: 0,
            max: 3,
            ticks: {
              stepSize: 1
            }
          }
        }
      }
    });
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
