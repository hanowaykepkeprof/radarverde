<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Verde - Painel do Cerrado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <div class="container-fluid vh-100 d-flex flex-column p-0">
    <div class="row flex-grow-1 g-0">
      <main class="col-lg-8 col-md-7 p-0" id="map-container" style="position: relative;">
        <div id="map" class="h-100"></div>
        <button id="toggle-info-btn" class="btn btn-light btn-sm">☰</button>
      </main>
      <aside class="col-lg-4 col-md-5 h-100">
        <div id="info" class="p-3 overflow-auto h-100">
    <div class="card mb-3">
        <div class="card-body">
            <h1 class="card-title h5">Radar Verde</h1>
            <h6 class="card-subtitle mb-2 text-muted">Parque Estadual do Cantão – Caseara/TO</h6>
            <p class="card-text mb-1">Temperatura: <b>35°C</b></p>
            <p class="card-text mb-1">Umidade: <b>20%</b></p>
            <p class="card-text mb-1">Vento: <b>30 km/h</b></p>
            <p class="card-text">Focos de Calor: <b>3</b></p>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <h5 class="card-title">Legenda de Risco</h5>
            <ul class="list-group list-group-flush">
                <li class="list-group-item d-flex align-items-center"><span class="d-inline-block rounded-circle me-2" style="width: 20px; height: 20px; background-color: #2ecc71;"></span> Baixo</li>
                <li class="list-group-item d-flex align-items-center"><span class="d-inline-block rounded-circle me-2" style="width: 20px; height: 20px; background-color: #f1c40f;"></span> Médio</li>
                <li class="list-group-item d-flex align-items-center"><span class="d-inline-block rounded-circle me-2" style="width: 20px; height: 20px; background-color: #e67e22;"></span> Alto</li>
                <li class="list-group-item d-flex align-items-center"><span class="d-inline-block rounded-circle me-2" style="width: 20px; height: 20px; background-color: #e74c3c;"></span> Crítico</li>
            </ul>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <h5 class="card-title">Controle de Áreas</h5>
            <div id="areaControls" class="d-grid gap-2"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <canvas id="graficoRisco" width="250" height="150"></canvas>
        </div>
    </div>

    <div class="card mt-3">
        <div class="card-body">
            <h5 class="card-title">Análise de Dados de Queimadas</h5>
            <canvas id="graficoDiaSemChuva"></canvas>
            <canvas id="graficoPrecipitacao"></canvas>
            <canvas id="graficoRiscoFogo"></canvas>
            <canvas id="graficoChuvaPrecipitacao"></canvas>
            <canvas id="graficoCompleto"></canvas>
        </div>
    </div>

    <div class="card mt-3">
        <div class="card-body">
            <h5 class="card-title">Adicionar Novo Ponto de Queimada</h5>
            <form id="formNovoPonto">
                <div class="mb-2">
                    <label for="latitude" class="form-label">Latitude</label>
                    <input type="number" step="any" class="form-control form-control-sm" id="latitude" required>
                </div>
                <div class="mb-2">
                    <label for="longitude" class="form-label">Longitude</label>
                    <input type="number" step="any" class="form-control form-control-sm" id="longitude" required>
                </div>
                <button type="button" class="btn btn-secondary btn-sm mb-2" id="btnLocalizacao">Usar Minha Localização</button>

                <div class="mb-2">
                    <label for="datahora" class="form-label">Data e Hora</label>
                    <input type="datetime-local" class="form-control form-control-sm" id="datahora" required>
                </div>
                <div class="mb-2">
                    <label for="diasemchuva" class="form-label">Dias Sem Chuva</label>
                    <input type="number" class="form-control form-control-sm" id="diasemchuva" required>
                </div>
                <div class="mb-2">
                    <label for="precipitacao" class="form-label">Precipitação (mm)</label>
                    <input type="number" step="any" class="form-control form-control-sm" id="precipitacao" required>
                </div>
                <div class="mb-2">
                    <label for="riscofogo" class="form-label">Risco de Fogo</label>
                    <input type="number" step="any" class="form-control form-control-sm" id="riscofogo" required>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Salvar Ponto</button>
                    <button type="button" class="btn btn-success" id="btnBaixarPontos">Baixar Pontos Salvos</button>
                </div>
            </form>
        </div>
    </div>
        </div>
      </aside>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>
</html>
