<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Verde - Painel do Cerrado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    @media (max-width: 767.98px) {
      .row {
        height: auto !important;
      }
      #map-container {
        height: 50vh;
      }
      aside {
        height: auto !important;
      }
    }
    #toggle-info-btn {
      position: absolute;
      top: 10px;
      left: 50px; /* Deslocado para a direita para não sobrepor os controlos de zoom */
      z-index: 401; /* Garante que o botão fique acima dos controles do mapa Leaflet */
    }
  </style>
</head>
<body class="bg-light">
  <div class="container-fluid vh-100 d-flex flex-column p-0">
    <div class="row flex-grow-1 g-0">
      <main class="col-lg-8 col-md-7 p-0" id="map-container" style="position: relative;">
        <div id="map" class="h-100"></div>
        <button id="toggle-info-btn" class="btn btn-light btn-sm">☰</button>
      </main>
      <aside class="col-lg-4 col-md-5 h-100">
        <div id="info" class="p-3 overflow-auto h-100">
    <div class="card mb-3">
        <div class="card-body">
            <h1 class="card-title h5">Radar Verde</h1>
            <h6 class="card-subtitle mb-2 text-muted">Parque Estadual do Cantão – Caseara/TO</h6>
            <p class="card-text mb-1">Temperatura: <b>35°C</b></p>
            <p class="card-text mb-1">Umidade: <b>20%</b></p>
            <p class="card-text mb-1">Vento: <b>30 km/h</b></p>
            <p class="card-text">Focos de Calor: <b>3</b></p>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <h5 class="card-title">Legenda de Risco</h5>
            <ul class="list-group list-group-flush">
                <li class="list-group-item d-flex align-items-center"><span class="d-inline-block rounded-circle me-2" style="width: 20px; height: 20px; background-color: #2ecc71;"></span> Baixo</li>
                <li class="list-group-item d-flex align-items-center"><span class="d-inline-block rounded-circle me-2" style="width: 20px; height: 20px; background-color: #f1c40f;"></span> Médio</li>
                <li class="list-group-item d-flex align-items-center"><span class="d-inline-block rounded-circle me-2" style="width: 20px; height: 20px; background-color: #e67e22;"></span> Alto</li>
                <li class="list-group-item d-flex align-items-center"><span class="d-inline-block rounded-circle me-2" style="width: 20px; height: 20px; background-color: #e74c3c;"></span> Crítico</li>
            </ul>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <h5 class="card-title">Controle de Áreas</h5>
            <div id="areaControls" class="d-grid gap-2"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
    <canvas id="graficoRisco" width="250" height="150"></canvas>
        </div>
    </div>
        </div>
      </aside>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <script>
    // Inicializa mapa centrado em Caseara/TO
    var map = L.map('map').setView([-9.2749, -49.9528], 11);

    // Camada base: imagens de satélite Esri
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye'
    }).addTo(map);

    // Lista de riscos
    var riscos = [
      {cor:'#2ecc71', texto:'Baixo', textoColor:'green'},
      {cor:'#f1c40f', texto:'Médio', textoColor:'#b7950b'},
      {cor:'#e67e22', texto:'Alto', textoColor:'#e67e22'},
      {cor:'#e74c3c', texto:'Crítico', textoColor:'red'}
    ];

    // Áreas fictícias dentro do parque
    var areas = [
      {
        nome: 'Área Norte',
        coords: [
          [-9.20,-49.99],
          [-9.20,-49.93],
          [-9.25,-49.93],
          [-9.25,-49.99]
        ],
        riscoIndex: 0
      },
      {
        nome: 'Área Central',
        coords: [
          [-9.28,-49.98],
          [-9.28,-49.94],
          [-9.33,-49.94],
          [-9.33,-49.98]
        ],
        riscoIndex: 2
      },
      {
        nome: 'Área Sul',
        coords: [
          [-9.35,-49.97],
          [-9.35,-49.93],
          [-9.40,-49.93],
          [-9.40,-49.97]
        ],
        riscoIndex: 3
      }
    ];

    // Criar polígonos
    areas.forEach((a,i)=>{
      a.poly = L.polygon(a.coords, {
        color:riscos[a.riscoIndex].cor,
        fillColor:riscos[a.riscoIndex].cor,
        fillOpacity:0.5
      }).addTo(map)
        .bindPopup(a.nome+' - Risco '+riscos[a.riscoIndex].texto);
    });

    // Criar controles (botões) para cada área
    var areaControlsDiv = document.getElementById('areaControls');
    areas.forEach((a,i)=>{
      var btn = document.createElement('button');
      btn.className = 'btn text-white';
      btn.textContent = 'Trocar Risco - '+a.nome+' (atual: '+riscos[a.riscoIndex].texto+')';
      btn.style.backgroundColor = riscos[a.riscoIndex].cor;
      btn.onclick = function(){
        // Avança risco dessa área
        a.riscoIndex = (a.riscoIndex + 1) % riscos.length;
        a.poly.setStyle({color:riscos[a.riscoIndex].cor, fillColor:riscos[a.riscoIndex].cor});
        a.poly.bindPopup(a.nome+' - Risco '+riscos[a.riscoIndex].texto);
        btn.textContent = 'Trocar Risco - '+a.nome+' (atual: '+riscos[a.riscoIndex].texto+')';
        btn.style.backgroundColor = riscos[a.riscoIndex].cor;
      };
      areaControlsDiv.appendChild(btn);
    });

    // Gráfico histórico de risco (dados fictícios)
    var ctx = document.getElementById('graficoRisco').getContext('2d');
    var grafico = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Dia -6','Dia -5','Dia -4','Dia -3','Dia -2','Ontem','Hoje'],
        datasets: [{
          label: 'Índice de Risco Médio (0=Baixo / 3=Crítico)',
          data: [1,2,2,3,3,2,3],
          borderColor: '#e74c3c',
          backgroundColor: 'rgba(231,76,60,0.2)',
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        scales: {
          y: {
            min: 0,
            max: 3,
            ticks: {
              stepSize: 1
            }
          }
        }
      }
    });

    // Lógica para alternar a visibilidade do painel de informações
    const toggleBtn = document.getElementById('toggle-info-btn');
    const infoAside = document.querySelector('aside');
    const mapContainer = document.getElementById('map-container');

    toggleBtn.addEventListener('click', () => {
      infoAside.classList.toggle('d-none');

      // Alterna as classes de coluna do Bootstrap para o mapa ocupar a tela inteira
      mapContainer.classList.toggle('col-lg-8');
      mapContainer.classList.toggle('col-md-7');
      mapContainer.classList.toggle('col-lg-12');
      mapContainer.classList.toggle('col-md-12');

      // Força o mapa a se redimensionar para o novo tamanho do contêiner
      // O timeout garante que a transição do DOM foi concluída antes de redimensionar o mapa
      setTimeout(() => {
        map.invalidateSize();
      }, 150);
    });
  </script>
</body>
</html>
